services:
  cbets-api:
    build: .
    image: cbets-b2c-risk-system:1.0.0
    container_name: cbets-b2c-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    # SQLite 单写者：不要开多个副本共享同一个 data 目录
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/healthz',timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
